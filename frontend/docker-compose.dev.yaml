name: fullstackapp-frontend-dev

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: crud-frontend:dev
    container_name: crud_frontend_dev
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - shared

networks:
  shared:
    external: true
    name: fullstackapp_shared