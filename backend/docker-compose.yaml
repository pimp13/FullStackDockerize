name: fullstackapp-backend-dev

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: crud-backend:dev
    container_name: crud_backend_dev
    env_file:
      - ./src/.env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGO_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASS}@mongo:27017/${MONGO_DB_NAME}?authSource=admin
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - /app/node_modules
    depends_on:
      - mongo
    networks:
      - shared
      - backend_internal

  mongo:
    image: mongo:7
    container_name: crud_mongo_dev
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASS}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data_dev:/data/db
    networks:
      - backend_internal

  mongo-express:
    image: mongo-express:1.0.2
    container_name: crud_mongo_express_dev
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASS}@mongo:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=${ME_USER}
      - ME_CONFIG_BASICAUTH_PASSWORD=${ME_PASS}
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_SITE_BASEURL=/
    ports:
      - "${MONGO_EXPRESS_PORT}:8081"
    depends_on:
      - mongo
    networks:
      - backend_internal

volumes:
  mongo_data_dev:

networks:
  backend_internal:
    driver: bridge
  shared:
    external: true
    name: fullstackapp_shared